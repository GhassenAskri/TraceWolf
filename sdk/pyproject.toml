[project]
name = "aicontrol"
version = "0.1.0"
description = "Capture LLM calls (OpenAI) with OpenTelemetry and send them to an AIControl API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-openai>=0.62,<0.63",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
openai = ["openai>=3,<4"]

[dependency-groups]
dev = [
  "openai>=3,<4",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests call real services (e.g. the OpenAI API) and are opt-in: `uv run pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: live test against real services, no mocks (needs OPENAI_API_KEY)"]
filterwarnings = [
  # Raised inside opentelemetry-instrumentation-openai (class-based pydantic config), not our code.
  "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
