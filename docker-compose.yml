# Local infrastructure for the AIControl API.
#   postgres : light index (volumes, llm_calls)
#   minio    : S3-compatible storage for full call traces (local stand-in for AWS S3 / GCS)
#
# MinIO images are pinned to the last community releases on quay.io. The community
# edition is in maintenance mode and no longer published on Docker Hub; the API only
# uses the plain S3 API, so any S3 provider can replace it via the S3_* settings.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicontrol}
      POSTGRES_DB: ${POSTGRES_DB:-aicontrol}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aicontrol}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-aicontrol-secret}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9101}:9001" # web console to browse stored traces
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the traces bucket, then exits.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aicontrol}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aicontrol-secret}
      S3_BUCKET: ${S3_BUCKET:-aicontrol-traces}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "

volumes:
  postgres-data:
  minio-data:
